# Redirect ALL HTTP → https://www
server {
    listen 80;
    listen [::]:80;
    server_name snackster.co.in www.snackster.co.in;

    return 301 https://www.snackster.co.in$request_uri;
}

# Redirect https non-www → https://www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snackster.co.in;

    ssl_certificate /etc/letsencrypt/live/snackster.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snackster.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.snackster.co.in$request_uri;
}

# Main site (ONLY www works)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.snackster.co.in;

    root /home/ubuntu/snackster/;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;

    # Canonical: /party-snacks-Hyderabad -> /party-snacks-hyderabad
    location = /party-snacks-Hyderabad {
        return 301 /party-snacks-hyderabad;
    }
    location = /party-snacks-Hyderabad/ {
        return 301 /party-snacks-hyderabad;
    }

    # Canonical: /about/ -> /about (except homepage /)
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Any true nginx 404s go to homepage
    error_page 404 =301 /;

    ssl_certificate /etc/letsencrypt/live/snackster.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snackster.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
