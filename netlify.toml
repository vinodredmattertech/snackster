[build]
  command = "npm run build:seo"
  publish = "build"

# Prefer extensionless URLs without trailing slash
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/party-snacks-Hyderabad"
  to = "/party-snacks-hyderabad"
  status = 301
  force = true

# Strip trailing slash so only the sitemap/canonical URL returns 200
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/404.html"
  to = "/"
  status = 301
  force = true

[context.production]
  command = "npm run build:seo"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
